<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e7c86">
  <title>Hidro PET</title>
  <meta name="description" content="Controle de presença Hidro PET para as turmas de hidroginástica de terças e quintas.">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="Hidro PET, início">

      <label class="whoami">Quem está usando

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>

</html>
